<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a0a00" />
  <title>Pelada Legends - Street Soccer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Russo+One&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas"></canvas>

    <div id="hud">
      <div class="hud-top">
        <div class="scoreboard">
          <div class="team-score home">
            <span class="team-swatch"></span>
            <span class="team-label">YOU</span>
            <span class="score" id="score-home">0</span>
          </div>
          <span class="score-divider">:</span>
          <div class="team-score away">
            <span class="score" id="score-away">0</span>
            <span class="team-label">RIVAL</span>
            <span class="team-swatch"></span>
          </div>
        </div>
        <div class="hud-meta">
          <div class="match-timer" id="match-timer">5:00</div>
          <div class="possession-chip" id="possession-chip">
            <span class="possession-dot"></span>
            <span id="possession-text">LOOSE BALL</span>
          </div>
        </div>
        <div class="ginga-container">
          <span class="ginga-label">GINGA</span>
          <div class="ginga-bar-outer"><div class="ginga-bar-inner" id="ginga-bar"></div></div>
          <span class="special-hint" id="special-hint">[SHIFT] SPECIAL MOVE</span>
        </div>
      </div>
      <div class="player-hud-icon" id="player-hud-icon">
        <span class="icon" id="hud-player-icon"></span>
        <div class="player-hud-copy">
          <span class="name" id="hud-player-name"></span>
          <span class="special" id="hud-player-special"></span>
        </div>
      </div>
      <button type="button" class="help-toggle" id="help-toggle">?</button>
      <div class="controls-hint" id="controls-hint">WASD - Move<br>SPACE - Shoot<br>SHIFT - Special Move<br>E - Pass</div>

      <div id="touch-controls" hidden>
        <div class="touch-stick" id="touch-stick">
          <div class="touch-stick-ring">
            <div class="touch-stick-knob" id="touch-stick-knob"></div>
          </div>
          <span class="touch-caption">MOVE</span>
        </div>
        <div class="touch-actions">
          <button type="button" class="touch-btn touch-pass" id="touch-pass">PASS</button>
          <button type="button" class="touch-btn touch-special" id="touch-special">
            GINGA
            <span id="touch-special-name">SPECIAL</span>
          </button>
          <button type="button" class="touch-btn touch-shoot" id="touch-shoot">SHOOT</button>
        </div>
      </div>
    </div>

    <div class="goal-splash" id="goal-splash">GOOOL!</div>
    <div class="game-message" id="game-message"></div>
    <div id="shoot-flash"></div>
    <div id="fx-overlay"></div>
  </div>

  <div id="select-screen">
    <h1>PELADA LEGENDS</h1>
    <div class="subtitle">Street Soccer</div>
    <div class="mural-wall" id="mural-wall"></div>
    <div class="select-dock">
      <button id="start-btn" type="button">KICK OFF</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
